<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/swim-icon.svg" />
    <!-- Zoom consentito (accessibilità). Il doppio tocco accidentale è evitato via CSS (touch-action). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FINPcoach - Nuoto Paralimpico</title>
    <!-- Font e icone sono inclusi nel bundle (vedi src/index.css): funzionano anche senza rete a bordo vasca. -->
    <meta name="description" content="Piattaforma gestionale e tecnica per allenatori FINP: gestione atleti con analisi medica e stima classi, programmazione stagionale intelligente, calcolo andature/ripartenze e schede vasca." />
  </head>
  <body class="bg-surface text-on-surface antialiased min-h-screen">
    <div id="root"></div>
    <script>
      // Nell'app Android: allinea le icone della barra di stato al tema effettivamente in uso
      // (tema di sistema o scelta manuale in "Aspetto"). Nel browser non fa nulla.
      (function () {
        function sync() {
          try {
            if (window.AndroidBridge && window.AndroidBridge.setSystemBarsDark) {
              window.AndroidBridge.setSystemBarsDark(document.documentElement.classList.contains('dark'));
            }
          } catch (e) { /* ignora */ }
        }
        new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        window.addEventListener('load', sync);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
